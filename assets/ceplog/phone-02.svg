  <text x="312" y="452" text-anchor="end" fill="#f2f0e9" font-family="Space Grotesk, Arial, sans-serif" font-size="13" font-weight="700">₺3.150 / ₺5.000</text>
  <rect x="48" y="466" width="264" height="7" rx="3.5" fill="#282b34"/>
  <rect x="48" y="466" width="166" height="7" rx="3.5" fill="#d4fc3b"/>
  <text x="48" y="487" fill="#8d8e93" font-family="DM Mono, monospace" font-size="8">KALAN ₺1.850</text>

