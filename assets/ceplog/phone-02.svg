  <text x="48" y="176" fill="#f2f0e9" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="700">₺21.350 <tspan fill="#8d8e93" font-size="15" font-weight="500">/ ₺30.000</tspan></text>
  <rect x="48" y="192" width="264" height="10" rx="5" fill="#282b34"/>
