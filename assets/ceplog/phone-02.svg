  <text x="312" y="300" text-anchor="end" fill="#f2f0e9" font-family="Space Grotesk, Arial, sans-serif" font-size="13" font-weight="700">₺9.200 / ₺10.000</text>
  <rect x="48" y="314" width="264" height="7" rx="3.5" fill="#282b34"/>
  <rect x="48" y="314" width="242" height="7" rx="3.5" fill="#7c75ff"/>
