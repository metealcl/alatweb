<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" role="img" aria-labelledby="p2-title p2-desc">
  <title id="p2-title">CepLog Bütçe ve Hedef Takibi Ekranı</title>
  <desc id="p2-desc">Kategori bütçeleri, birikim hedefleri ve ilerleme çubukları (örnek veri)</desc>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17191f"/>
      <stop offset="100%" stop-color="#101114"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="348" height="708" rx="46" fill="url(#p2-bg)" stroke="#2e313b" stroke-width="3"/>
  <rect x="14" y="14" width="332" height="692" rx="38" fill="#101114" stroke="#ffffff14" stroke-width="1"/>
  <rect x="132" y="26" width="96" height="22" rx="11" fill="#07080a"/>
  <circle cx="212" cy="37" r="4" fill="#1d2230"/>
  <text x="38" y="41" fill="#f2f0e9" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700">09:41</text>
  <rect x="292" y="32" width="22" height="10" rx="3" fill="none" stroke="#f2f0e9" stroke-width="1.2"/>
  <rect x="294" y="34" width="15" height="6" rx="1.5" fill="#d4fc3b"/>

