  <text x="34" y="522" fill="#9b9b9c" font-family="DM Mono, monospace" font-size="10" letter-spacing="1.2">BİRİKİM HEDEFLERİ</text>
  <rect x="30" y="534" width="144" height="102" rx="16" fill="#7c75ff" stroke="#b5a9ff55"/>
  <text x="46" y="556" fill="#101114" font-family="DM Mono, monospace" font-size="9" font-weight="700">ACİL FON</text>
  <text x="46" y="584" fill="#faf9f5" font-family="Space Grotesk, Arial, sans-serif" font-size="20" font-weight="700">₺45.000</text>
  <text x="46" y="602" fill="#e5e1ff" font-family="DM Mono, monospace" font-size="9">HEDEF: ₺60.000</text>
  <rect x="46" y="612" width="112" height="6" rx="3" fill="#10111440"/>
  <rect x="46" y="612" width="84" height="6" rx="3" fill="#d4fc3b"/>

  <rect x="186" y="534" width="144" height="102" rx="16" fill="#181a20" stroke="#ffffff14"/>
  <text x="202" y="556" fill="#d4fc3b" font-family="DM Mono, monospace" font-size="9">YENİ EKİPMAN</text>
  <text x="202" y="584" fill="#f2f0e9" font-family="Space Grotesk, Arial, sans-serif" font-size="20" font-weight="700">₺18.500</text>
  <text x="202" y="602" fill="#8d8e93" font-family="DM Mono, monospace" font-size="9">HEDEF: ₺35.000</text>
  <rect x="202" y="612" width="112" height="6" rx="3" fill="#282b34"/>
  <rect x="202" y="612" width="59" height="6" rx="3" fill="#d4fc3b"/>

  <!-- Bottom nav bar -->
  <rect x="30" y="650" width="300" height="42" rx="21" fill="#181a20" stroke="#ffffff18"/>
  <text x="76" y="675" text-anchor="middle" fill="#8d8e93" font-family="DM Mono, monospace" font-size="9">ÖZET</text>
  <rect x="112" y="656" width="76" height="30" rx="15" fill="#d4fc3b"/>
  <text x="150" y="675" text-anchor="middle" fill="#101114" font-family="DM Mono, monospace" font-size="9" font-weight="700">BÜTÇE</text>
  <text x="218" y="675" text-anchor="middle" fill="#8d8e93" font-family="DM Mono, monospace" font-size="9">HEDEF</text>
  <text x="284" y="675" text-anchor="middle" fill="#8d8e93" font-family="DM Mono, monospace" font-size="9">ANALİZ</text>
</svg>
