  <text x="48" y="558" fill="#9b9b9c" font-family="Manrope, Arial, sans-serif" font-size="11">Bakiye ve toplamlar deterministik servislerle</text>
  <text x="48" y="574" fill="#9b9b9c" font-family="Manrope, Arial, sans-serif" font-size="11">hesaplanır; dil katmanı yalnızca bu kesin</text>
