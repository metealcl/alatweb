      <stop offset="0%" stop-color="#17191f"/>
      <stop offset="100%" stop-color="#101114"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="348" height="708" rx="46" fill="url(#p3-bg)" stroke="#2e313b" stroke-width="3"/>
