  <rect x="30" y="486" width="300" height="148" rx="20" fill="#181a20" stroke="#ffffff14"/>
  <text x="48" y="512" fill="#d4fc3b" font-family="DM Mono, monospace" font-size="9" letter-spacing="1.2">MİMARİ PRENSİP</text>
