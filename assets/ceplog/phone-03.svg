  <rect x="56" y="170" width="34" height="28" rx="7" fill="#d4fc3b"/>
  <text x="73" y="188" text-anchor="middle" fill="#101114" font-family="Space Grotesk, Arial, sans-serif" font-size="12" font-weight="700">12</text>
  <text x="102" y="182" fill="#f2f0e9" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700">Bulut Depolama &amp; Araçlar</text>
  <text x="102" y="196" fill="#8d8e93" font-family="DM Mono, monospace" font-size="8">HER AYIN 12'Sİ · OTOMATİK</text>
