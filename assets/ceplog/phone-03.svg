<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" role="img" aria-labelledby="p3-title p3-desc">
  <title id="p3-title">CepLog Düzenli Ödemeler ve Finansal İçgörüler Ekranı</title>
  <desc id="p3-desc">Tekrarlanan ödemeler takvimi ve deterministik hesaplama üzerine kurulu finansal içgörüler (örnek veri)</desc>
  <defs>
